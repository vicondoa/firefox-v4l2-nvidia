name: Release

on:
  push:
    tags:
      - "v*-nixling.*"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Free runner disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          if [ -n "${AGENT_TOOLSDIRECTORY:-}" ]; then
            sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          fi
          df -h
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          fetch-depth: 1
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/flakehub-cache-action@main
      - name: Build Firefox (unwrapped)
        run: nix build .#unwrapped -o result
      - name: Package
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p release
          tar czf "release/firefox-v4l2-nvidia-${VERSION}-x86_64-linux.tar.gz" -C result .
          cd release
          sha256sum *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: release/

  release:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      id-token: write
      pull-requests: write
    steps:
      - name: Free runner disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          if [ -n "${AGENT_TOOLSDIRECTORY:-}" ]; then
            sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          fi
          df -h
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: release-binaries
          path: release/
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          gh release create "$VERSION" release/*.tar.gz release/SHA256SUMS \
            --title "$VERSION" \
            --notes "Firefox ${VERSION#v} with V4L2 H.264 hardware decode patches for NVIDIA/nixling VMs."
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/flakehub-cache-action@main
      - name: Rebuild and export to binary cache
        env:
          NIX_CACHE_SIGNING_KEY: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          CACHE_DIR="$RUNNER_TEMP/nix-cache"
          SIGNING_KEY="$RUNNER_TEMP/signing-key.pem"

          rm -rf "$CACHE_DIR"
          nix build .#unwrapped -o result
          mkdir -p "$CACHE_DIR"

          printf '%s\n' "$NIX_CACHE_SIGNING_KEY" > "$SIGNING_KEY"
          nix store sign --key-file "$SIGNING_KEY" $(nix path-info -r ./result)
          nix copy --to "file://$CACHE_DIR" ./result

          printf 'StoreDir: /nix/store\nWantMassQuery: 1\nPriority: 40\n' > "$CACHE_DIR/nix-cache-info"
          rm -f "$SIGNING_KEY"

      - name: Push GitHub Pages binary cache
        run: |
          set -euo pipefail
          CACHE_DIR="$RUNNER_TEMP/nix-cache"
          PAGES_DIR="$RUNNER_TEMP/gh-pages"

          rm -rf "$PAGES_DIR"
          git fetch origin gh-pages
          git worktree add -B gh-pages "$PAGES_DIR" origin/gh-pages

          mkdir -p "$PAGES_DIR/nar"
          cp "$CACHE_DIR/nix-cache-info" "$PAGES_DIR/"
          cp -R "$CACHE_DIR/nar/." "$PAGES_DIR/nar/" 2>/dev/null || true
          find "$CACHE_DIR" -maxdepth 1 -name '*.narinfo' -exec cp {} "$PAGES_DIR/" \;

          cd "$PAGES_DIR"
          git add -A
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "cache: add firefox closure"
          git push origin gh-pages
      - name: Compute SRI hashes and commit prebuilt manifest
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          REPO="${{ github.repository }}"
          BRANCH="prebuilt-${VERSION}"
          git fetch origin nixling/main
          git switch -C "$BRANCH" origin/nixling/main
          mkdir -p nix
          tarball=$(find release/ -name "*.tar.gz" | head -1)
          sri=$(nix hash file --type sha256 --sri "$tarball")
          url="https://github.com/${REPO}/releases/download/${VERSION}/$(basename "$tarball")"
          cat > nix/prebuilt.json <<EOF
          {
            "version": "$VERSION",
            "system": "x86_64-linux",
            "binaries": {
              "firefox-v4l2-nvidia": {
                "url": "$url",
                "hash": "$sri"
              }
            }
          }
          EOF
      - name: Commit prebuilt manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          BRANCH="prebuilt-${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nix/prebuilt.json
          git diff --cached --quiet && exit 0
          git commit -m "release: update prebuilt manifest for ${GITHUB_REF_NAME}"
          git push --force-with-lease origin HEAD:"refs/heads/${BRANCH}"
          if gh pr list --base nixling/main --head "$BRANCH" --state open --json number --jq 'length' | grep -qx '0'; then
            gh pr create \
              --base nixling/main \
              --head "$BRANCH" \
              --title "release: update prebuilt manifest for ${VERSION}" \
              --body "Update nix/prebuilt.json for ${VERSION} after the release artifacts were published."
          fi
          gh workflow run pr.yml --ref "$BRANCH"
