name: PR

on:
  pull_request:

jobs:
  nix:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      id-token: write
    env:
      GITHUB_TOKEN: ""
      ACTIONS_RUNTIME_TOKEN: ""
    steps:
      - name: Free runner disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          if [ -n "${AGENT_TOOLSDIRECTORY:-}" ]; then
            sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          fi
          df -h
      - uses: actions/checkout@v4
      - name: Check changed files
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git diff --name-only "$BASE_SHA" HEAD > "$RUNNER_TEMP/changed-files"
          if grep -Ev '^(\.github/|flake\.(nix|lock)$|nix/)' "$RUNNER_TEMP/changed-files"; then
            echo "source=true" >> "$GITHUB_OUTPUT"
          else
            echo "source=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/flakehub-cache-action@main
        if: steps.changes.outputs.source == 'true'
      - name: Check flake
        run: nix flake check --no-build
      - name: Build binary-backed package
        if: steps.changes.outputs.source == 'false'
        run: nix build .#default --print-build-logs
      - name: Build Firefox source package
        if: steps.changes.outputs.source == 'true'
        run: nix build .#unwrapped --print-build-logs
